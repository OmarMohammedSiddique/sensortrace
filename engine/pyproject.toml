[project]
name = "sensortrace-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "omarmohammedsiddique", email = "omarmohammedatiff@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pywavelets>=1.10.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
