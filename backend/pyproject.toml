[project]
name = "sensortrace-api"
version = "0.1.0"
description = "SensorTrace REST API, background jobs, storage and reports"
readme = "README.md"
authors = [
    { name = "omarmohammedsiddique", email = "omarmohammedatiff@gmail.com" }
]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "boto3>=1.44.1",
    "cryptography>=46",
    "email-validator>=2.3.0",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "reportlab>=5.1.0",
    "rq>=3.0.0",
    "sensortrace-engine",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
    "vercel>=0.12.2",
    "zxcvbn>=4.5.0",
]

[project.scripts]
sensortrace-api = "sensortrace_api:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pypdf>=7.0.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.uv.sources]
sensortrace-engine = { path = "../engine", editable = true }

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP046", "UP047"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
