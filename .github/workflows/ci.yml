name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (lint, tests, reference cross-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - name: Fetch independent reference implementation (dev-only oracle)
        run: ../scripts/fetch_reference_implementation.sh ../data/third_party/prnu-python
      - run: uv run pytest -q --cov=sensortrace_engine --cov-report=term-missing:skip-covered

  backend:
    name: Backend (lint, migrations, integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sensortrace
          POSTGRES_PASSWORD: sensortrace
          POSTGRES_DB: sensortrace
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U sensortrace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 63799:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - name: Migrations apply and match the models
        run: uv run alembic upgrade head && uv run alembic check
      - name: OpenAPI document is up to date
        run: uv run python -m app.cli openapi | diff - ../docs/api/openapi.json
      - run: uv run pytest -q

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    name: End-to-end (Docker Compose and Playwright)
    runs-on: ubuntu-latest
    needs: [engine, backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Free runner disk space
        # Hosted runners have about 14 GB free; the images plus the browser need more.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - name: Start the complete stack
        # The suite registers many accounts from one address; relax the sign-in rate limit for it.
        env:
          ST_RATE_AUTH_PER_15MIN: "1000"
          # Hosted runners have 2 CPUs and about 7 GB of memory.
          WORKER_CPUS: "2"
          WORKER_MEM_LIMIT: 4g
        run: docker compose --profile app up --build -d --wait --wait-timeout 600
      - name: Drop the build cache
        run: docker builder prune -af >/dev/null && df -h /
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: frontend
        run: npx playwright test
      - name: Stack logs
        if: failure()
        run: docker compose --profile app logs --tail=200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  security:
    name: Dependency and container checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Python dependency audit (engine)
        working-directory: engine
        run: uv sync --frozen && uv run --with pip-audit pip-audit
      - name: Python dependency audit (backend)
        working-directory: backend
        run: uv sync --frozen && uv run --with pip-audit pip-audit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm ci && npm audit --omit=dev --audit-level=high
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t sensortrace-backend:ci .
      - name: Scan backend image for known vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest
          image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress sensortrace-backend:ci
